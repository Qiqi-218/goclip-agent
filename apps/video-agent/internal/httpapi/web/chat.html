<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Agent · 工作台</title>
<style>
/* ============================================================================
   Design tokens.
   Values mirror the DeepSeek Harness theme (--dsw-*) so this reads as the same
   product family: the same neutral-bluish ramp, deepseek-500 as the action
   colour, the 4/8/12/16/20/28 radius scale, and the three elevation steps.
   Montserrat is DSH's brand face and is not bundled here, so headings use the
   system stack DSH itself falls back to for body copy.
   ========================================================================== */
:root{
  --n-00:#fff; --n-50:#f9fafb; --n-60:#f5f6f7; --n-75:#f1f3f5; --n-100:#ebeef2;
  --n-200:#e1e5ee; --n-300:#cfd3d6; --n-400:#adb2b8; --n-500:#979da6;
  --n-600:#81858c; --n-700:#61666b; --n-750:#43454a; --n-800:#353638;
  --n-850:#2c2c2e; --n-875:#232324; --n-900:#1b1b1c; --n-950:#151517; --n-1000:#0f1115;
  --ds-400:#7aaaff; --ds-450:#5686fe; --ds-500:#4176e6; --ds-600:#4868b2;
  --green-500:#22c55e; --amber-500:#f59e0b; --red-600:#ec1313;

  --radius-xs:4px; --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  --radius-xl:20px; --radius-panel:28px;
  --shadow-1:0 2px 4px 0 #0000000d;
  --shadow-1b:0 4px 12px 0 #00000005;
  --shadow-2:0 4px 12px 0 #00000005, 0 2px 8px 0 #0000000a;
  --shadow-3:0 0 1px 0 #0003, 0 0 4px 0 #00000005, 0 12px 32px 0 #00000014;
  --dur:180ms; --dur-fast:120ms; --ease:cubic-bezier(.4,0,.2,1);

  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;

  --bg-base:var(--n-50);
  --bg-layer:var(--n-00);
  --bg-sunken:var(--n-60);
  --bg-hover:#2631480f;
  --bg-selected:#eaf0fd;
  --line-1:#0000000a;
  --line-2:#0000001a;
  --label-1:var(--n-1000);
  --label-2:var(--n-700);
  --label-3:var(--n-600);
  --label-4:var(--n-400);
  --accent:var(--ds-500);
  --accent-hover:var(--ds-600);
  --on-accent:#fff;
}
html[data-theme="dark"]{
  --bg-base:var(--n-950);
  --bg-layer:var(--n-900);
  --bg-sunken:var(--n-875);
  --bg-hover:#ffffff14;
  --bg-selected:#283142;
  --line-1:#ffffff12;
  --line-2:#ffffff1f;
  --label-1:#f4f6f8;
  --label-2:var(--n-400);
  --label-3:var(--n-500);
  --label-4:var(--n-600);
  --accent:var(--ds-400);
  --accent-hover:var(--ds-450);
  --on-accent:var(--n-950);
  --shadow-1:0 2px 4px 0 #0006;
  --shadow-2:0 4px 12px 0 #0005, 0 2px 8px 0 #0004;
  --shadow-3:0 0 1px 0 #fff2, 0 12px 32px 0 #0007;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-base);color:var(--label-1);font:400 14px/22px var(--font);
  overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}

.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:10px;padding:0 14px;height:52px;flex:none;
  background:var(--bg-layer);border-bottom:1px solid var(--line-1)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;cursor:pointer;
  padding:5px 8px;border-radius:var(--radius-sm);transition:background var(--dur-fast) var(--ease)}
.brand:hover{background:var(--bg-hover)}
.mark{width:22px;height:22px;border-radius:7px;flex:none;
  background:linear-gradient(140deg,var(--ds-450),var(--ds-500));
  box-shadow:0 2px 6px color-mix(in srgb,var(--ds-500) 40%,transparent);
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.crumb{display:flex;align-items:center;gap:7px;color:var(--label-3);font-size:13px;min-width:0}
.crumb b{color:var(--label-1);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.crumb .sep{color:var(--label-4)}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;
  padding:3px 10px;font-size:11.5px;color:var(--label-3);white-space:nowrap;background:var(--bg-layer)}
.chip.ok{color:var(--green-500);border-color:color-mix(in oklab,var(--green-500) 45%,var(--line-2))}
.chip.off{color:var(--red-600);border-color:color-mix(in oklab,var(--red-600) 40%,var(--line-2))}
.chip.busy{color:var(--amber-500);border-color:color-mix(in oklab,var(--amber-500) 45%,var(--line-2))}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--bg-layer);
  color:var(--label-2);border-radius:var(--radius-sm);padding:6px 11px;font-size:12.5px;cursor:pointer;
  transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
.btn:hover{background:var(--bg-hover);color:var(--label-1)}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--bg-selected);border-color:color-mix(in oklab,var(--accent) 40%,var(--line-2));color:var(--accent);font-weight:600}
.btn.icon{padding:6px 8px}

.body{display:flex;min-height:0;flex:1}

/* project rail */
.rail{width:64px;flex:none;background:var(--bg-layer);border-right:1px solid var(--line-1);
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto}
.pdot{width:40px;height:40px;border-radius:var(--radius-md);display:grid;place-items:center;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--label-2);background:var(--bg-sunken);flex:none;
  transition:transform var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease);
  position:relative}
.pdot:hover{transform:translateY(-2px);color:var(--label-1)}
.pdot.on{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 10px color-mix(in oklab,var(--accent) 35%,transparent)}
.pdot .badge{position:absolute;right:-3px;bottom:-3px;min-width:16px;height:16px;border-radius:999px;
  background:var(--bg-layer);border:1px solid var(--line-2);color:var(--label-3);font-size:9.5px;
  display:grid;place-items:center;padding:0 3px;font-weight:600}
.railsep{width:24px;height:1px;background:var(--line-2);margin:2px 0;flex:none}

/* sidebar */
.side{width:280px;flex:none;background:var(--bg-layer);border-right:1px solid var(--line-1);
  display:flex;flex-direction:column;min-height:0}
.sidehead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;
  font-size:11.5px;font-weight:600;color:var(--label-3);letter-spacing:.02em;flex:none}
.scroll{overflow-y:auto;min-height:0;flex:1;scrollbar-width:thin}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:var(--n-200);border-radius:999px;border:2px solid transparent;background-clip:content-box}
html[data-theme="dark"] .scroll::-webkit-scrollbar-thumb{background:var(--n-750);background-clip:content-box}

.sess{padding:8px 11px;margin:1px 7px;border-radius:var(--radius-sm);cursor:pointer;display:flex;
  flex-direction:column;gap:3px;transition:background var(--dur-fast) var(--ease)}
.sess:hover{background:var(--bg-hover)}
.sess.on{background:var(--bg-selected)}
.sess b{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess span{font-size:11px;color:var(--label-3);display:flex;align-items:center;gap:6px}
.sess .kill{margin-left:auto;opacity:0;transition:opacity var(--dur-fast) var(--ease);font-style:normal}
.sess:hover .kill{opacity:1}
.sess .kill:hover{color:var(--red-600)}
.live{width:6px;height:6px;border-radius:50%;background:var(--green-500);display:inline-block}

.node{display:flex;align-items:center;gap:7px;padding:6px 9px;margin:1px 7px;border-radius:var(--radius-sm);
  cursor:pointer;font-size:12.5px;transition:background var(--dur-fast) var(--ease)}
.node:hover{background:var(--bg-hover)}
.node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .tag{font-size:10px;color:var(--label-4);border:1px solid var(--line-2);border-radius:999px;padding:0 6px}
.leaf{padding:5px 9px;margin:1px 7px;border-radius:var(--radius-sm);font-size:11.5px;
  color:var(--label-3);display:flex;gap:7px;align-items:center}
.leaf:hover{background:var(--bg-hover);color:var(--label-1)}
.leaf .meta{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--label-4)}
/* Delete affordances stay hidden until the row is hovered, so a list reads as
   content rather than as a row of destructive buttons. */
.leaf .del,.node .del{opacity:0;cursor:pointer;color:var(--label-4);font-style:normal;flex:none;
  transition:opacity var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.leaf:hover .del,.node:hover .del{opacity:1}
.leaf .del:hover,.node .del:hover{color:var(--red-600)}
.pcard{position:relative}
.pcard .pdel{position:absolute;top:10px;right:10px;opacity:0;border:1px solid var(--line-2);background:var(--bg-layer);
  color:var(--label-3);border-radius:var(--radius-sm);font-size:11px;padding:3px 8px;cursor:pointer;
  transition:opacity var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.pcard:hover .pdel{opacity:1}
.pcard .pdel:hover{color:var(--red-600);border-color:var(--red-600)}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg-base)}
.view{overflow-y:auto;min-height:0;flex:1}

.home{max-width:1080px;margin:0 auto;padding:40px 28px 60px}
.hero{margin-bottom:30px;animation:rise var(--dur) var(--ease)}
.hero h1{margin:0 0 8px;font-size:27px;line-height:1.25;font-weight:600;letter-spacing:-.02em}
.hero p{margin:0;color:var(--label-3);font-size:14px;max-width:640px;line-height:1.7}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sectionhead{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.sectionhead h2{margin:0;font-size:13px;font-weight:600;color:var(--label-3);letter-spacing:.02em}
.sectionhead .line{flex:1;height:1px;background:var(--line-1)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--bg-layer);border:1px solid var(--line-1);border-radius:var(--radius-lg);padding:16px;
  cursor:pointer;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:11px;
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:color-mix(in oklab,var(--accent) 30%,var(--line-1))}
.pcard h3{margin:0;font-size:15px;font-weight:600}
.pcard .stats{display:flex;gap:14px;flex-wrap:wrap}
.pstat{display:flex;flex-direction:column;gap:1px}
.pstat b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.pstat span{font-size:10.5px;color:var(--label-4)}
.pempty{border:1px dashed var(--line-2);border-radius:var(--radius-lg);padding:26px;text-align:center;
  color:var(--label-3);font-size:13px}

.thread{max-width:780px;margin:0 auto;padding:26px 24px 10px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:11px;animation:rise var(--dur) var(--ease)}
.avatar{width:26px;height:26px;border-radius:var(--radius-sm);flex:none;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;border:1px solid var(--line-1);background:var(--bg-layer);color:var(--accent)}
.msg.user .avatar{background:var(--accent);color:var(--on-accent);border-color:transparent}
.bubble{min-width:0;flex:1}
.txt{white-space:pre-wrap;word-break:break-word;line-height:1.7;padding-top:2px}
.msg.user .txt{background:var(--bg-layer);border:1px solid var(--line-1);border-radius:var(--radius-md);
  padding:10px 13px;box-shadow:var(--shadow-1b)}

.tool{border:1px solid var(--line-1);border-radius:var(--radius-md);background:var(--bg-layer);
  overflow:hidden;margin-top:9px;box-shadow:var(--shadow-1b);animation:rise var(--dur) var(--ease)}
.tool>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;align-items:center;gap:9px;font-size:12.5px}
.tool>summary::-webkit-details-marker{display:none}
.tool .tname{font-family:var(--mono);font-size:11.5px;font-weight:600}
.tool .targ{color:var(--label-4);font-family:var(--mono);font-size:11px;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tool .state{font-size:10.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--label-3);flex:none}
.tool .state.run{color:var(--amber-500);border-color:color-mix(in oklab,var(--amber-500) 40%,var(--line-2))}
.tool .state.ok{color:var(--green-500);border-color:color-mix(in oklab,var(--green-500) 40%,var(--line-2))}
.tool .state.err{color:var(--red-600);border-color:color-mix(in oklab,var(--red-600) 40%,var(--line-2))}
.tool pre{margin:0;padding:11px 13px;border-top:1px solid var(--line-1);background:var(--bg-sunken);
  font-family:var(--mono);font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-word;
  max-height:340px;overflow:auto}
.caret2{color:var(--label-4);font-size:8px;flex:none;transition:transform var(--dur) var(--ease)}
.tool[open] .caret2{transform:rotate(90deg)}

.evsplit{display:flex;border-top:1px solid var(--line-1)}
.evcol{flex:1;min-width:0;padding:10px 13px}
.evcol+.evcol{border-left:1px solid var(--line-1)}
.evcol h4{margin:0 0 6px;font-size:10.5px;font-weight:600;color:var(--label-4);letter-spacing:.03em}
.evcol .row{font-size:11.5px;color:var(--label-2);line-height:1.65;display:flex;gap:7px;padding:3px 0}
.evcol .t{font-family:var(--mono);color:var(--accent);flex:none;font-size:10.5px}

.notice{border:1px solid var(--line-1);border-radius:var(--radius-md);background:var(--bg-sunken);
  color:var(--label-3);padding:9px 12px;font-size:12px;margin-top:9px}
.working{display:flex;align-items:center;gap:9px;color:var(--label-3);font-size:12.5px;padding-left:37px}
.ring{width:13px;height:13px;flex:none}
.ring circle{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.ring .track{opacity:.25}
.ring .arc{stroke-dasharray:12 150;transform-origin:center;
  animation:dshSpin 1.5s linear infinite,dshDash 1.5s ease-in-out infinite,shimmer 1.5s ease-in-out infinite}
@keyframes dshSpin{to{transform:rotate(360deg)}}
@keyframes dshDash{0%{stroke-dasharray:12 150;stroke-dashoffset:0}
  50%{stroke-dasharray:24 150;stroke-dashoffset:-6}
  100%{stroke-dasharray:12 150;stroke-dashoffset:0}}
@keyframes shimmer{0%,100%{opacity:.45}50%{opacity:1}}

.composer{flex:none;border-top:1px solid var(--line-1);background:var(--bg-layer);padding:12px 24px 14px}
.cwrap{max-width:780px;margin:0 auto}
.drops{display:flex;flex-wrap:wrap;gap:7px}
.drop{display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--bg-sunken);
  border-radius:var(--radius-sm);padding:5px 9px;font-size:11.5px;color:var(--label-3);max-width:100%}
.drop b{color:var(--label-1);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.drop .x{cursor:pointer;font-style:normal}
.drop .x:hover{color:var(--red-600)}
.field{display:flex;gap:9px;align-items:flex-end;border:1px solid var(--line-2);border-radius:var(--radius-md);
  background:var(--bg-layer);padding:8px 8px 8px 12px;
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%,transparent)}
.field.drag{border-style:dashed;border-color:var(--accent);background:var(--bg-selected)}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;min-height:24px;max-height:180px;
  line-height:1.6;padding:6px 0}
.send{border:0;border-radius:var(--radius-sm);background:var(--accent);color:var(--on-accent);font-weight:600;
  font-size:13px;padding:8px 15px;cursor:pointer;flex:none;
  transition:background var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
.send:hover{background:var(--accent-hover)}
.send:active{transform:scale(.96)}
.send.stop{background:var(--red-600)}
.hint{display:flex;justify-content:space-between;gap:10px;margin-top:7px;font-size:11px;color:var(--label-4)}
kbd{border:1px solid var(--line-2);border-bottom-width:2px;border-radius:var(--radius-xs);padding:0 4px;font-size:10px;font-family:inherit}

.insp{width:344px;flex:none;background:var(--bg-layer);border-left:1px solid var(--line-1);
  display:flex;flex-direction:column;min-height:0}
.itabs{display:flex;gap:3px;padding:9px 10px;border-bottom:1px solid var(--line-1);flex:none}
.itab{border:1px solid transparent;background:transparent;color:var(--label-3);font-size:12px;padding:5px 10px;
  border-radius:var(--radius-sm);cursor:pointer;transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.itab:hover{background:var(--bg-hover);color:var(--label-1)}
.itab.on{background:var(--bg-selected);color:var(--accent);font-weight:600}
.ipane{padding:12px 13px;font-size:12.5px}
.card{border:1px solid var(--line-1);border-radius:var(--radius-md);padding:11px 12px;margin-bottom:9px;
  background:var(--bg-base);animation:rise var(--dur) var(--ease)}
.card h3{margin:0 0 6px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kv{font-family:var(--mono);font-size:11px;color:var(--label-3);line-height:1.7;word-break:break-all}
.card a{color:var(--accent);text-decoration:none;font-size:11.5px}
.card a:hover{text-decoration:underline}
.player{width:100%;border-radius:var(--radius-sm);background:#000;display:block;margin-top:8px;max-height:280px}
.pbar{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}
.mini{border:1px solid var(--line-2);background:var(--bg-layer);color:var(--label-2);font-size:11px;
  padding:4px 9px;border-radius:var(--radius-sm);cursor:pointer;text-decoration:none;
  transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.mini:hover{background:var(--bg-hover);color:var(--label-1);border-color:var(--accent)}
.clip{display:flex;gap:9px;font-family:var(--mono);font-size:11px;padding:6px 0;border-bottom:1px solid var(--line-1)}
.clip:last-child{border-bottom:0}
.clip .t{color:var(--accent);flex:none}
.emptyhint{padding:14px;color:var(--label-3);font-size:12px;line-height:1.7}

.strip{display:flex;gap:2px;height:34px;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg-sunken);
  border:1px solid var(--line-1);margin-top:9px}
.seg{display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;color:#fff;cursor:pointer;
  min-width:8px;transition:filter var(--dur-fast) var(--ease)}
.seg:hover{filter:brightness(1.18)}

.veil{position:fixed;inset:0;display:none;place-items:center;z-index:60;pointer-events:none;
  background:color-mix(in oklab,var(--accent) 7%,transparent);border:3px dashed var(--accent)}
.veil.on{display:grid}
.veil div{background:var(--bg-layer);border:1px solid var(--line-2);border-radius:var(--radius-lg);
  padding:16px 24px;font-size:14px;box-shadow:var(--shadow-2)}
.modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:24px}
.modal.on{display:flex}
.modal .mask{position:absolute;inset:0;background:#0000003d;backdrop-filter:blur(3px);animation:fade var(--dur) var(--ease)}
.modal .box{position:relative;z-index:1;background:var(--bg-layer);border-radius:var(--radius-panel);
  padding:14px;width:min(1120px,100%);box-shadow:var(--shadow-3);animation:pop var(--dur) var(--ease)}
.modal header{display:flex;align-items:center;gap:10px;padding:2px 6px 12px}
.modal h3{margin:0;font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal video{width:100%;max-height:76vh;border-radius:var(--radius-md);background:#000;display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.toast{position:fixed;top:64px;left:50%;z-index:1100;pointer-events:none;
  width:max-content;max-width:min(620px,calc(100vw - 48px));padding:11px 15px;border-radius:var(--radius-lg);
  background:var(--n-800);color:#f2f4f6;font-size:13px;line-height:20px;box-shadow:var(--shadow-3);
  transform:translateX(-50%);opacity:0}
.toast.on{animation:toastIn 160ms ease-out forwards,toastOut 600ms ease 2600ms forwards}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;visibility:hidden}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
@media (max-width:1180px){ .insp{width:300px} }
@media (max-width:980px){ .side{display:none} }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand" id="brand"><span class="mark">V</span><span>Video Agent</span></div>
    <div class="crumb" id="crumb"></div>
    <div class="grow"></div>
    <span class="chip" id="cModel">检查模型…</span>
    <span class="chip" id="cTools">工具 —</span>
    <span class="chip" id="cStep">待命</span>
    <button class="btn icon" id="bTheme" title="切换明暗主题">◐</button>
    <button class="btn icon on" id="bInsp" title="显示或隐藏右侧检查器">▤</button>
  </div>

  <div class="body">
    <nav class="rail" id="rail"></nav>
    <aside class="side" id="side"></aside>
    <section class="main">
      <div class="view" id="view"></div>
      <div class="composer">
        <div class="cwrap">
          <div class="drops" id="drops" style="margin-bottom:0"></div>
          <div class="field" id="field">
            <textarea id="input" rows="1" placeholder="说你想怎么剪，或把视频拖进窗口。"></textarea>
            <button class="send" id="send">发送</button>
          </div>
          <div class="hint"><span>助手会自己调用工具 · 每一步都可展开核对</span>
            <span><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span></div>
        </div>
      </div>
    </section>
    <aside class="insp" id="insp"></aside>
  </div>
</div>

<div class="veil" id="veil"><div>松开即可上传素材</div></div>
<div class="modal" id="modal"><div class="mask"></div><div class="box">
  <header><h3 id="mTitle">预览</h3>
    <a class="mini" id="mOpen" target="_blank">新标签打开</a>
    <button class="mini" id="mClose">关闭 Esc</button></header>
  <video id="mVideo" controls playsinline preload="metadata"></video>
</div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const S={
  projects:[], project:null, session:"", sessions:[],
  assets:[], timelines:[], jobs:[],
  running:false, controller:null, attachments:[], pane:"assets",
};

/* theme */
document.documentElement.dataset.theme=localStorage.getItem("va.theme")||"light";
$("bTheme").onclick=()=>{
  const n=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=n;localStorage.setItem("va.theme",n);
};
function syncInsp(){
  const on=localStorage.getItem("va.insp")!=="0";
  $("insp").style.display=on?"":"none";
  $("bInsp").classList.toggle("on",on);
}
$("bInsp").onclick=()=>{localStorage.setItem("va.insp",localStorage.getItem("va.insp")==="0"?"1":"0");syncInsp()};
syncInsp();

/* feedback */
let toastTimer=null;
function toast(msg){
  const t=$("toast");t.textContent=msg;t.classList.remove("on");
  void t.offsetWidth;t.classList.add("on");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("on"),3400);
}
function setStep(text,busy){const e=$("cStep");e.textContent=text;e.className="chip"+(busy?" busy":"")}
function fmtSize(n){if(!n&&n!==0)return"";if(n<1024)return n+" B";if(n<1048576)return (n/1024).toFixed(1)+" KB";
  if(n<1073741824)return (n/1048576).toFixed(1)+" MB";return (n/1073741824).toFixed(2)+" GB"}
function fmtDur(us){const s=Math.max(0,Math.floor((us||0)/1e6));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
const initials=s=>esc(String(s||"?").trim().slice(0,2).toUpperCase());

/* api */
async function api(path,opts){
  const r=await fetch(path,opts);
  let j=null;try{j=await r.json()}catch(e){}
  if(!j||j.ok!==true)throw new Error((j&&j.error&&j.error.message)||("请求失败 "+r.status));
  return j.result;
}
const tool=(name,args)=>api("/v1/tools/"+name,{method:"POST",headers:{"content-type":"application/json"},
  body:JSON.stringify(args||{})});

/* routing */
function go(hash){ if(location.hash!==hash) location.hash=hash; else route(); }
async function route(){
  const m=/^#\/p\/(.+)$/.exec(location.hash||"");
  if(m) await openProject(decodeURIComponent(m[1]));
  else { S.project=null; renderCrumb(); renderRail(); await loadProjects(); }
}
window.addEventListener("hashchange",()=>{route()});

/* data */
async function loadProjects(){
  try{ S.projects=await api("/v1/agent/overview"); }catch(e){ S.projects=[]; }
  renderRail();
  if(!S.project)renderHome();
}
async function loadProjectData(){
  if(!S.project)return;
  const id=S.project.id;
  const [assets,timelines,jobs]=await Promise.all([
    tool("assets_list",{project_id:id}).catch(()=>({})),
    api("/v1/agent/projects/"+encodeURIComponent(id)+"/timelines").catch(()=>[]),
    tool("jobs_list",{}).catch(()=>[]),
  ]);
  S.assets=Object.values(assets||{});
  S.timelines=timelines||[];
  const tids=new Set(S.timelines.map(t=>t.id));
  S.jobs=(jobs||[]).filter(j=>tids.has(j.timeline_id));
  renderSide(); renderInspector();
}
/* A conversation belongs to one project, so the remembered session is keyed by
   project. A single global key meant switching projects carried the previous
   project's history — and its answers — into the new one. */
const sessionKey = () => "va.session." + ((S.project && S.project.id) || "none");
function rememberSession(id){
  S.session = id || "";
  const key = sessionKey();
  if (id) localStorage.setItem(key, id); else localStorage.removeItem(key);
}
function recallSession(){
  S.session = (S.project ? localStorage.getItem(sessionKey()) : "") || "";
  return S.session;
}
async function loadSessions(){
  try{ S.sessions=await api("/v1/agent/sessions"+(S.project?"?project="+encodeURIComponent(S.project.id):"")); }catch(e){ S.sessions=[]; }
  renderSessions();
}

/* rail */
function renderRail(){
  const rail=$("rail");
  rail.innerHTML=S.projects.map(p=>{
    const on=S.project&&S.project.id===p.id;
    return '<div class="pdot'+(on?" on":"")+'" data-p="'+esc(p.id)+'" title="'+esc(p.name||p.id)+'">'
      +initials(p.name||p.id)+(p.asset_count?'<span class="badge">'+p.asset_count+'</span>':'')+'</div>';
  }).join("")+'<div class="railsep"></div>'
    +'<div class="pdot" id="railAdd" title="新建项目">＋</div>'
    +'<div class="pdot" id="railHome" title="全部项目">⌂</div>';
  rail.querySelectorAll("[data-p]").forEach(e=>e.onclick=()=>go("#/p/"+encodeURIComponent(e.dataset.p)));
  $("railHome").onclick=()=>go("#/");
  $("railAdd").onclick=createProject;
}
async function createProject(){
  const name=prompt("新项目名称","我的视频");
  if(name===null)return;
  const id="p-"+Date.now().toString(36);
  try{
    await tool("project_create",{id,name:(name||"").trim()||id});
    toast("已创建项目 "+(name||id));
    await loadProjects();
    go("#/p/"+encodeURIComponent(id));
  }catch(e){toast("创建失败："+e.message)}
}

/* sidebar */
function renderSide(){
  const side=$("side");
  if(!S.project){
    side.innerHTML='<div class="sidehead"><span>会话</span></div><div class="scroll"><div id="sessList"></div></div>';
    renderSessions();
    return;
  }
  side.innerHTML=
    '<div class="sidehead"><span>'+esc(S.project.name||S.project.id)+'</span>'
      +'<button class="mini" id="sdNew">＋ 新对话</button></div>'
    +'<div class="scroll">'
      +'<div class="sidehead" style="padding-top:2px">会话</div><div id="sessList"></div>'
      +'<div class="sidehead" style="border-top:1px solid var(--line-1);margin-top:6px">素材</div><div id="assetList"></div>'
      +'<div class="sidehead" style="border-top:1px solid var(--line-1);margin-top:6px">时间线</div><div id="tlList"></div>'
    +'</div>';
  $("sdNew").onclick=()=>{rememberSession("");renderThread([]);loadSessions()};
  renderSessions(); renderAssets(); renderTimelines();
}
function renderSessions(){
  const box=$("sessList"); if(!box)return;
  box.innerHTML=S.sessions.length?S.sessions.map(s=>
    '<div class="sess'+(s.id===S.session?" on":"")+'" data-s="'+esc(s.id)+'">'
    +'<b>'+esc(s.title||s.id.slice(0,22))+'</b>'
    +'<span>'+(s.running?'<i class="live"></i>进行中':'已完成')+' · '+s.messages
    +' 条<i class="kill" title="删除">✕</i></span></div>').join("")
    :'<div class="emptyhint">还没有对话。直接问助手，或先把视频拖进来。</div>';
  box.querySelectorAll("[data-s]").forEach(e=>{
    e.onclick=ev=>{
      if(ev.target.classList.contains("kill")){ev.stopPropagation();killSession(e.dataset.s);return}
      rememberSession(e.dataset.s);replay(S.session);
    };
  });
}
async function killSession(id){
  if(!confirm("删除这个会话？"))return;
  try{
    await fetch("/v1/agent/sessions/"+encodeURIComponent(id),{method:"DELETE"});
    if(id===S.session){rememberSession("");renderThread([])}
    loadSessions();
  }catch(e){toast("删除失败")}
}
function renderAssets(){
  const box=$("assetList"); if(!box)return;
  box.innerHTML=S.assets.length?S.assets.map(a=>
    '<div class="leaf" title="'+esc(a.path||"")+'"><span>🎬</span>'
    +'<span class="nm">'+esc(a.id.replace("asset-","").slice(0,8))+'</span>'
    +'<span class="meta">'+fmtDur(a.duration_us)+'</span>'
    +'<i class="del" data-dela="'+esc(a.id)+'" title="删除这个素材及其分析结果">✕</i></div>').join("")
    :'<div class="emptyhint">还没有素材。把视频拖进窗口即可上传。</div>';
  box.querySelectorAll("[data-dela]").forEach(e=>e.onclick=ev=>{
    ev.stopPropagation(); deleteAsset(e.dataset.dela);
  });
}
function renderTimelines(){
  const box=$("tlList"); if(!box)return;
  box.innerHTML=S.timelines.length?S.timelines.map(t=>{
    const total=(t.items||[]).reduce((n,i)=>n+i.source_out_us-i.source_in_us,0);
    return '<div class="node" data-t="'+esc(t.id)+'"><span class="nm">'+esc(t.id)+'</span>'
      +'<span class="tag">v'+t.revision+' · '+fmtDur(total)+'</span>'
      +'<i class="del" data-delt="'+esc(t.id)+'" title="删除这条时间线">✕</i></div>';
  }).join(""):'<div class="emptyhint">还没有时间线。让助手组装一条。</div>';
  box.querySelectorAll("[data-t]").forEach(e=>e.onclick=ev=>{
    if(ev.target.classList.contains("del")){ev.stopPropagation();deleteTimeline(e.dataset.t);return}
    localStorage.setItem("va.timeline",e.dataset.t);
    S.pane="timeline"; renderInspector();
  });
}

/* crumb */
function renderCrumb(){
  const c=$("crumb");
  if(!S.project){c.innerHTML='<span>全部项目</span>';return}
  c.innerHTML='<span style="cursor:pointer" id="crumbHome">全部项目</span><span class="sep">/</span>'
    +'<b>'+esc(S.project.name||S.project.id)+'</b>';
  $("crumbHome").onclick=()=>go("#/");
}

/* views */
function renderHome(){
  $("view").innerHTML=
    '<div class="home"><div class="hero"><h1>把长视频，剪成你要的样子。</h1>'
    +'<p>每个项目是一段素材的完整工作区：素材、内容理解、时间线、成片。选中一个开始，或者新建一个。</p></div>'
    +'<div class="sectionhead"><h2>项目</h2><div class="line"></div>'
    +'<button class="btn" id="homeAdd">＋ 新建项目</button></div>'
    +'<div class="pgrid" id="pgrid"></div></div>';
  $("homeAdd").onclick=createProject;
  const grid=$("pgrid");
  if(!S.projects.length){
    grid.innerHTML='<div class="pempty" style="grid-column:1/-1">还没有项目。点「新建项目」，或把视频拖进窗口让助手建一个。</div>';
    return;
  }
  grid.innerHTML=S.projects.map(p=>
    '<div class="pcard" data-p="'+esc(p.id)+'">'
    +'<button class="pdel" data-delp="'+esc(p.id)+'" title="删除这个项目及其全部素材、时间线">删除</button>'
    +'<h3>'+esc(p.name||p.id)+'</h3><div class="stats">'
    +'<div class="pstat"><b>'+p.asset_count+'</b><span>素材</span></div>'
    +'<div class="pstat"><b>'+p.evidence_count+'</b><span>证据</span></div>'
    +'<div class="pstat"><b>'+p.timeline_count+'</b><span>时间线</span></div>'
    +'<div class="pstat"><b>'+p.render_count+'</b><span>成片</span></div>'
    +'</div></div>').join("");
  grid.querySelectorAll("[data-p]").forEach(e=>e.onclick=ev=>{
    if(ev.target.classList.contains("pdel")){ev.stopPropagation();deleteProject(e.dataset.p);return}
    go("#/p/"+encodeURIComponent(e.dataset.p));
  });
}

/* Deleting. Each confirmation names what else goes with it, because these
   cascades remove derived work (analysis, evidence, timelines) that is expensive
   to recreate. Rendered MP4s stay on disk and the dialog says so. */
async function deleteProject(id){
  const p=S.projects.find(x=>x.id===id)||{};
  const msg="删除项目「"+(p.name||id)+"」？\n\n会一并删除它的 "
    +p.asset_count+" 个素材、"+p.evidence_count+" 条分析证据、"+p.timeline_count+" 条时间线。\n"
    +"已经导出的 MP4 文件会保留在 data/exports 里。\n\n这个操作不能撤销。";
  if(!confirm(msg))return;
  try{
    await api("/v1/agent/projects/"+encodeURIComponent(id),{method:"DELETE"});
    toast("已删除项目");
    if(S.project&&S.project.id===id){S.project=null;go("#/")}
    await loadProjects();
  }catch(e){toast("删除失败："+e.message)}
}
async function deleteAsset(id){
  if(!S.project)return;
  const a=S.assets.find(x=>x.id===id)||{};
  if(!confirm("删除素材 "+id.replace("asset-","").slice(0,10)+"？\n\n它的分析证据会一起删除，已导出的 MP4 保留。"))return;
  try{
    await api("/v1/agent/projects/"+encodeURIComponent(S.project.id)+"/assets/"+encodeURIComponent(id),{method:"DELETE"});
    toast("已删除素材");
    await loadProjectData();
  }catch(e){toast("删除失败："+e.message)}
}
async function deleteTimeline(id){
  if(!confirm("删除时间线 "+id+"？\n\n它的所有版本和渲染记录会一起删除，已导出的 MP4 保留。"))return;
  try{
    await api("/v1/agent/timelines/"+encodeURIComponent(id),{method:"DELETE"});
    if(localStorage.getItem("va.timeline")===id)localStorage.removeItem("va.timeline");
    toast("已删除时间线");
    await loadProjectData();
  }catch(e){toast("删除失败："+e.message)}
}
async function openProject(id){
  try{ S.project=await tool("project_get",{id}); }
  catch(e){ S.project=S.projects.find(p=>p.id===id)||{id:id,name:id}; }
  // Entering a project starts from that project's own conversation. Without
  // this, the previous project's session stayed selected and its history — and
  // its answers about other assets — appeared here.
  recallSession();
  renderCrumb();
  $("view").innerHTML='<div class="thread" id="thread"></div>';
  await loadProjectData();
  await loadSessions();
  // Entering a project resumes its most recent conversation. An empty page in a
  // project that clearly has history reads as lost work, and starting fresh is
  // an explicit action the user can take.
  if(!S.session&&S.sessions.length)rememberSession(S.sessions[0].id);
  if(S.session)await replay(S.session); else renderThread([]);
}

/* conversation */
const threadEl=()=>$("thread");
function addMsg(role,text){
  const t=threadEl();
  const el=document.createElement("div");
  el.className="msg "+(role==="user"?"user":"assistant");
  el.innerHTML='<div class="avatar">'+(role==="user"?"你":"AI")+'</div><div class="bubble"><div class="txt"></div></div>';
  el.querySelector(".txt").textContent=text;
  t.appendChild(el);scrollDown();
  return el.querySelector(".bubble");
}
function addToolCard(name,args){
  const d=document.createElement("details");d.className="tool";
  d.innerHTML='<summary><span class="caret2">▶</span><span class="tname">'+esc(name)+'</span>'
    +'<span class="targ">'+esc(args)+'</span><span class="state run">运行中</span></summary>'
    +'<pre>等待结果…</pre>';
  threadEl().appendChild(d);scrollDown();return d;
}
function settleToolCard(card,result,ok){
  card.querySelector(".state").className="state "+(ok?"ok":"err");
  card.querySelector(".state").textContent=ok?"完成":"失败";
  let pretty=result;try{pretty=JSON.stringify(JSON.parse(result),null,2)}catch(e){}
  card.querySelector("pre").textContent=pretty;
  if(!ok)card.open=true;
  // analyze returns transcripts and frame descriptions together; splitting them
  // makes it visible that the picture was understood, not only the speech.
  if(ok&&!card.querySelector(".evsplit")){
    try{
      const payload=JSON.parse(result);
      const ev=(payload.result&&payload.result.evidence)||[];
      const cues=ev.filter(e=>e.transcript), frames=ev.filter(e=>e.visual_summary);
      if(ev.length&&(cues.length||frames.length)){
        const col=(title,rows)=>'<div class="evcol"><h4>'+title+' · '+rows.length+'</h4>'
          +(rows.slice(0,80).map(e=>'<div class="row"><span class="t">'+fmtDur(e.start_us)+'</span>'
            +'<span>'+esc((e.transcript||e.visual_summary||"").slice(0,120))+'</span></div>').join("")
            ||'<div class="kv">无</div>')+'</div>';
        const wrap=document.createElement("div");
        wrap.className="evsplit";
        wrap.innerHTML=col("🎙 字幕",cues)+col("🖼 画面",frames);
        card.appendChild(wrap);
      }
    }catch(e){}
  }
  scrollDown();
}
function addNotice(text){
  const el=document.createElement("div");el.className="notice";el.textContent=text;
  threadEl().appendChild(el);scrollDown();
}
function addWorking(){
  const el=document.createElement("div");el.className="working";el.id="working";
  el.innerHTML='<svg class="ring" viewBox="0 0 20 20"><circle class="track" cx="10" cy="10" r="8"/>'
    +'<circle class="arc" cx="10" cy="10" r="8"/></svg><span>正在思考…</span>';
  threadEl().appendChild(el);scrollDown();
}
const stopWorking=()=>{const e=$("working");if(e)e.remove()};
function scrollDown(){const v=$("view");if(v)v.scrollTop=v.scrollHeight}

function renderThread(views){
  const t=threadEl(); if(!t)return;
  if(!views||!views.length){ t.innerHTML=emptyState(); bindChips(); return; }
  t.innerHTML="";
  views.forEach(v=>{
    if(v.role==="user")addMsg("user",v.text);
    else if(v.role==="assistant"){ if(v.text)addMsg("assistant",v.text); }
    else if(v.role==="tool")settleToolCard(addToolCard(v.tool_name,v.arguments||"{}"),v.result||"",!!v.succeeded);
  });
  scrollDown();
}
function emptyState(){
  return '<div style="text-align:center;padding:8vh 20px 0">'
    +'<h1 style="font-size:22px;font-weight:600;margin:0 0 9px;letter-spacing:-.02em">从这里开始</h1>'
    +'<p style="color:var(--label-3);font-size:13.5px;line-height:1.75;max-width:520px;margin:0 auto 20px">'
    +'说清楚你要什么就行。助手会自己查素材、抽帧看画面、找片段、组时间线，每一步都能展开核对。</p>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'
    +["先看看这个项目里有什么","对素材做一次内容理解（含抽帧）","找出画面里有人的片段","把结果导出成 MP4"]
      .map(s=>'<button class="btn chipbtn">'+s+'</button>').join("")
    +'</div></div>';
}
function bindChips(){
  document.querySelectorAll(".chipbtn").forEach(b=>b.onclick=()=>{$("input").value=b.textContent;send()});
}

/* streaming turn */
async function send(){
  if(S.running)return;
  const input=$("input");
  let text=input.value.trim();
  if(!text&&!S.attachments.length)return;
  if(S.attachments.length){
    const vids=S.attachments.filter(a=>a.kind==="video");
    const subs=S.attachments.filter(a=>a.kind==="subtitle");
    const parts=[];
    if(vids.length)parts.push("我刚上传了视频素材："+vids.map(a=>a.path).join("、"));
    if(subs.length)parts.push("以及字幕文件："+subs.map(a=>a.path).join("、"));
    const pre=parts.join("；")+"。";
    text=text?pre+"我的要求是："+text:pre+(S.project?"请导入到这个项目并做一次内容理解。":"请建个项目导入，然后做内容理解。");
  }
  S.attachments=[];renderDrops();
  input.value="";input.style.height="auto";

  if(!threadEl())$("view").innerHTML='<div class="thread" id="thread"></div>';
  if(threadEl().querySelector("h1"))threadEl().innerHTML="";
  addMsg("user",text);addWorking();
  S.running=true;
  $("send").textContent="停止";$("send").classList.add("stop");
  setStep("运行中",true);
  const cards={};let bubble=null;
  S.controller=new AbortController();
  try{
    const resp=await fetch("/v1/agent/chat",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({session_id:S.session,project_id:(S.project&&S.project.id)||"",message:text}),signal:S.controller.signal});
    if(!resp.ok||!resp.body)throw new Error("请求失败 "+resp.status);
    const reader=resp.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){
      const {value,done}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf("\n\n"))>=0){
        const chunk=buf.slice(0,i);buf=buf.slice(i+2);
        let name="message",data="";
        chunk.split("\n").forEach(l=>{
          if(l.startsWith("event:"))name=l.slice(6).trim();
          else if(l.startsWith("data:"))data+=l.slice(5).trim();
        });
        if(!data)continue;
        let ev;try{ev=JSON.parse(data)}catch(e){continue}
        if(name==="session"){if(ev.session_id)rememberSession(ev.session_id);continue}
        if(name!=="agent")continue;
        if(ev.kind==="step"){setStep("第 "+ev.step+" 步",true);continue}
        if(ev.kind==="compacted"){addNotice(ev.text);continue}
        if(ev.kind==="text"){stopWorking();if(!bubble)bubble=addMsg("assistant","");
          bubble.querySelector(".txt").textContent+=ev.text;scrollDown();continue}
        if(ev.kind==="tool_start"){stopWorking();cards[ev.tool_call_id]=addToolCard(ev.tool_name,ev.arguments||"{}");
          setStep("调用 "+ev.tool_name,true);continue}
        if(ev.kind==="tool_end"){const c=cards[ev.tool_call_id];if(c)settleToolCard(c,ev.result||"",!!ev.succeeded);
          bubble=null;addWorking();rememberTimeline(ev.tool_name,ev.result);continue}
        if(ev.kind==="error"){stopWorking();addMsg("assistant","⚠️ "+(ev.text||"出错了"));continue}
        if(ev.kind==="done"){stopWorking();
          if(ev.text&&!bubble)addMsg("assistant",ev.text);
          else if(ev.text&&bubble&&!bubble.querySelector(".txt").textContent)bubble.querySelector(".txt").textContent=ev.text;
          continue}
      }
    }
  }catch(e){
    stopWorking();
    addMsg("assistant",e.name==="AbortError"?"已停止这一轮。":"⚠️ "+(e.message||"连接中断"));
  }finally{
    S.running=false;S.controller=null;
    $("send").textContent="发送";$("send").classList.remove("stop");
    setStep("待命",false);stopWorking();
    loadProjects();loadProjectData();loadSessions();
  }
}
function rememberTimeline(toolName,result){
  if(toolName!=="timeline_create"&&toolName!=="proposal_create")return;
  try{
    const r=JSON.parse(result).result;
    const id=r&&(r.id||(r.timeline&&r.timeline.id));
    if(id)localStorage.setItem("va.timeline",id);
  }catch(e){}
}
async function replay(id){
  try{ renderThread(await api("/v1/agent/sessions/"+encodeURIComponent(id))); }
  catch(e){ renderThread([]) }
}

/* inspector */
function renderInspector(){
  const tabs=[["assets","素材"],["outputs","成片"],["timeline","时间线"]];
  $("insp").innerHTML='<div class="itabs">'+tabs.map(([k,l])=>
    '<button class="itab'+(S.pane===k?" on":"")+'" data-k="'+k+'">'+l+'</button>').join("")
    +'</div><div class="scroll"><div class="ipane" id="ipane"></div></div>';
  $("insp").querySelectorAll(".itab").forEach(b=>b.onclick=()=>{S.pane=b.dataset.k;renderInspector()});
  loadInspector();
}
function loadInspector(){
  const pane=$("ipane"); if(!pane)return;
  if(!S.project){pane.innerHTML='<div class="emptyhint">先选一个项目。</div>';return}
  if(S.pane==="assets")return paneAssets(pane);
  if(S.pane==="outputs")return paneOutputs(pane);
  return paneTimeline(pane);
}
function paneAssets(pane){
  pane.innerHTML=S.assets.length?S.assets.map(a=>
    '<div class="card"><h3>🎬 '+esc(a.id.replace("asset-","").slice(0,10))+'</h3>'
    +'<div class="kv">'+a.width+'×'+a.height+' · '+fmtDur(a.duration_us)+' · '+(a.has_audio?"有音轨":"无音轨")
    +'<br>'+esc((a.path||"").split(/[\\/]/).pop()||"")+'</div></div>').join("")
    :'<div class="emptyhint">还没有素材。把视频拖进窗口即可上传。</div>';
}
function paneOutputs(pane){
  const done=S.jobs.filter(j=>j.status==="completed");
  pane.innerHTML=done.length?done.map(j=>{
    const v=j.validation||{};
    return '<div class="card"><h3>'+(j.kind==="preview"?"预览":"成片")
      +' <span class="chip ok">'+esc(j.status)+'</span></h3>'
      +'<video class="player" controls playsinline preload="metadata" src="/v1/artifacts/'+encodeURIComponent(j.id)+'"></video>'
      +'<div class="pbar"><button class="mini" data-play="'+esc(j.id)+'">◱ 放大</button>'
      +'<a class="mini" href="/v1/artifacts/'+encodeURIComponent(j.id)+'" download>↓ 下载</a></div>'
      +'<div class="kv" style="margin-top:7px">'+esc((j.output||"").split(/[\\/]/).pop()||j.id)
      +(v.duration_us?'<br>'+fmtDur(v.duration_us)+' · '+v.width+'×'+v.height+' · '+v.frames+' 帧':'')+'</div></div>';
  }).join(""):'<div class="emptyhint">还没有成片。让助手导出，或在时间线页生成预览。</div>';
  pane.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{
    const j=S.jobs.find(x=>x.id===b.dataset.play); if(j)openPlayer(j);
  });
}
function paneTimeline(pane){
  const id=localStorage.getItem("va.timeline");
  const t=S.timelines.find(x=>x.id===id)||S.timelines[0];
  if(!t){pane.innerHTML='<div class="emptyhint">这个项目还没有时间线。让助手组装一条。</div>';return}
  const total=(t.items||[]).reduce((n,i)=>n+i.source_out_us-i.source_in_us,0)||1;
  const palette=["#4176e6","#22c55e","#f59e0b","#7aaaff","#ec1313","#4868b2"];
  const strip=(t.items||[]).map((i,n)=>{
    const w=Math.max(3,(i.source_out_us-i.source_in_us)/total*100);
    return '<div class="seg" style="width:'+w+'%;background:'+palette[n%palette.length]+'" title="'
      +fmtDur(i.source_in_us)+'–'+fmtDur(i.source_out_us)+'">'+(w>9?(n+1):"")+'</div>';
  }).join("");
  const rendered=S.jobs.filter(j=>j.timeline_id===t.id&&j.status==="completed")
    .sort((a,b)=>String(b.updated_at).localeCompare(String(a.updated_at)))[0];
  pane.innerHTML='<div class="card"><h3>'+esc(t.id)+' <span class="chip">v'+t.revision+'</span></h3>'
    +'<div class="kv">'+t.width+'×'+t.height+' · '+t.fps_num+'/'+t.fps_den+' fps · 共 '+fmtDur(total)
    +' · '+(t.items||[]).length+' 段</div>'
    +'<div class="strip">'+(strip||'<div class="seg" style="flex:1;background:var(--line-2)"></div>')+'</div></div>'
    +(rendered
      ?'<div class="card"><h3>这条时间线的成片</h3>'
        +'<video class="player" controls playsinline preload="metadata" src="/v1/artifacts/'+encodeURIComponent(rendered.id)+'"></video>'
        +'<div class="pbar"><button class="mini" data-play="'+esc(rendered.id)+'">◱ 放大</button>'
        +'<a class="mini" href="/v1/artifacts/'+encodeURIComponent(rendered.id)+'" download>↓ 下载</a></div></div>'
      :'<div class="card"><h3>还没有成片</h3><div class="kv">可以先渲染一个低开销预览。</div>'
        +'<div class="pbar"><button class="mini" id="mkPreview">▶ 生成预览</button></div></div>')
    +'<div class="card"><h3>片段</h3>'
    +((t.items||[]).map((i,n)=>'<div class="clip"><span class="t">'+(n+1)+'. '+fmtDur(i.source_in_us)+'–'
      +fmtDur(i.source_out_us)+'</span><span>'+esc((i.asset_id||"").replace("asset-","").slice(0,8))+'</span></div>').join("")
      ||'<div class="kv">空时间线</div>')+'</div>';
  pane.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{
    const j=S.jobs.find(x=>x.id===b.dataset.play); if(j)openPlayer(j);
  });
  const pb=$("mkPreview");
  if(pb)pb.onclick=async()=>{
    if(!confirm("生成这条时间线的预览？"))return;
    pb.disabled=true;pb.textContent="提交中…";
    try{ await tool("render_submit",{timeline_id:t.id,preview:true}); toast("预览已提交，稍后刷新"); setTimeout(loadProjectData,4000); }
    catch(e){ toast("提交失败："+e.message); pb.disabled=false; pb.textContent="▶ 生成预览"; }
  };
}

/* player */
function openPlayer(job){
  const url="/v1/artifacts/"+encodeURIComponent(job.id);
  $("mTitle").textContent=((job.kind==="preview")?"预览":"成片")+" · "+((job.output||"").split(/[\\/]/).pop()||job.id);
  $("mOpen").href=url;
  const v=$("mVideo");
  if(v.dataset.job!==job.id){v.src=url;v.dataset.job=job.id;v.load()}
  $("modal").classList.add("on");
  const p=v.play(); if(p&&p.catch)p.catch(()=>{});
}
function closePlayer(){const v=$("mVideo");try{v.pause()}catch(e){}$("modal").classList.remove("on")}
$("mClose").onclick=closePlayer;
$("modal").addEventListener("click",e=>{if(e.target.classList.contains("mask"))closePlayer()});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("modal").classList.contains("on")){closePlayer();e.stopPropagation()}
},true);

/* attachments */
function renderDrops(){
  const box=$("drops");
  box.style.marginBottom=S.attachments.length?"7px":"0";
  box.innerHTML=S.attachments.map((a,i)=>
    '<span class="drop">'+(a.kind==="subtitle"?"📝":a.kind==="video"?"🎬":"📄")
    +'<b>'+esc(a.name)+'</b>'+fmtSize(a.size)+'<i class="x" data-i="'+i+'">✕</i></span>').join("");
  box.querySelectorAll(".x").forEach(x=>x.onclick=()=>{
    S.attachments.splice(Number(x.dataset.i),1);renderDrops();
  });
}
async function uploadFiles(files){
  for(const f of files){
    const fd=new FormData();fd.append("file",f,f.name);
    toast("正在上传 "+f.name);
    try{ S.attachments.push(await api("/v1/agent/upload",{method:"POST",body:fd})); renderDrops(); }
    catch(e){toast("上传失败："+e.message)}
  }
}
["dragenter","dragover"].forEach(n=>document.addEventListener(n,e=>{
  if(!e.dataTransfer||!Array.from(e.dataTransfer.types||[]).includes("Files"))return;
  e.preventDefault();$("veil").classList.add("on");$("field").classList.add("drag");
}));
document.addEventListener("dragleave",e=>{if(e.relatedTarget)return;$("veil").classList.remove("on");$("field").classList.remove("drag")});
document.addEventListener("drop",e=>{
  e.preventDefault();$("veil").classList.remove("on");$("field").classList.remove("drag");
  const files=[...((e.dataTransfer&&e.dataTransfer.files)||[])].filter(f=>/\.(mp4|mov|m4v|srt|vtt)$/i.test(f.name));
  if(!files.length){toast("只支持 MP4 / MOV / M4V / SRT / VTT");return}
  uploadFiles(files);
});

/* config + boot */
async function loadConfig(){
  try{
    const c=await api("/v1/agent/config");
    const m=$("cModel");
    if(c.configured){m.textContent="模型 "+c.model;m.className="chip ok"}
    else{m.textContent="模型未配置";m.className="chip off";toast("服务端没有读到模型配置，助手无法推理")}
    $("cTools").textContent="工具 "+c.tool_count;
  }catch(e){$("cModel").textContent="无法读取配置";$("cModel").className="chip off"}
}
$("send").onclick=()=>{S.running?S.controller&&S.controller.abort():send()};
$("input").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}
});
$("input").addEventListener("input",e=>{
  const t=e.target;t.style.height="auto";t.style.height=Math.min(t.scrollHeight,180)+"px";
});
$("brand").onclick=()=>go("#/");

(async()=>{
  // The session is recalled per project inside openProject, so boot only clears
  // the in-memory handle; the persisted ids stay keyed by project.
  S.session="";
  await loadConfig();
  await loadProjects();
  await route();
})();
</script>
