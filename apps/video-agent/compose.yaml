services:
  video-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: zylar06/video-agent:local
    working_dir: /workspace
    environment:
      VIDEO_AGENT_ALLOW_CONTAINER_LISTEN: "1"
    volumes:
      - ./workspace:/workspace
    ports:
      - "127.0.0.1:8090:8090"
    entrypoint: ["/usr/local/bin/video-agent"]
    command: ["--help"]
