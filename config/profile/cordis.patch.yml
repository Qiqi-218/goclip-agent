# Profile patch: 智能剪辑助手的模型接入
#
# 模型走阿里云百炼（Model Studio）的 OpenAI 兼容端点。
# 这里 **不写密钥** —— `apiKeyEnv` 是凭据引用，按请求经 harness 凭据 seam 解析；
# 密钥只留在启动进程的环境变量里，绝不提交到仓库。
#
# 已实测（2026-10-01）：该端点 HTTP 200 可用，且支持 OpenAI 工具调用
# （tools / tool_calls 返回正常），所以 DSH 的 agent 循环能在上面跑。

- id: llm-pi-ai
  config:
    providers:
      bailian:
        apiKeyEnv: AUTOCLIP_TEXT_API_KEY
        api: openai-completions
        # 端点走环境变量，不写死。
        #
        # 百炼的 baseURL 是**按 workspace 分配的**（形如
        # https://llm-<每个账号不同>.cn-beijing.maas.aliyuncs.com/compatible-mode/v1），
        # 写死意味着别人 clone 下来必须来改这一行才能跑。它也不是密钥，
        # 但把某个具体 workspace 的地址放进公开仓库没有意义。
        baseURL: !!js process.env.AUTOCLIP_TEXT_BASE_URL
        displayName: 阿里云百炼
        models:
          # 主力：已实测该端点可用（HTTP 200）。
          - id: qwen3.8-omni-flash
            name: Qwen3.8-Omni-Flash
            contextWindow: 1048576

# 默认模型必须显式指向百炼。
#
# 不写这一段时界面模型选择器显示 deepseek-flash —— 那是上游默认值，而本机
# **没有** DEEPSEEK_API_KEY，于是输入框看上去可用、实际一发起就失败。
# 竞赛要求标明所用大模型名称与版本号，因此这里必须与实际调用的模型一致。
- id: agent-default-model
  config:
    provider: bailian
    model: qwen3.8-omni-flash

- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# 证据面板：`video_evidence_view` 的调用卡片。
#
# 它必须作为**独立的一行**出现，不能只写进插件的 cordis.patch.yml ——
# 客户端 bundle 的清单是服务端启动时按 loader 行扫出来的（读每行的包名 →
# package.json 的 dsh.client → exports["./client"] → lib/client.js），
# 没有这一行就没有那次扫描，界面里只会看到通用工具行。
#
# 而且必须放在 `insert:` 里：patch 的一条**不带 insert 的顶层项**只会去
# 匹配已有的同名行，匹配不到就什么都不做（不报错），这一行也就永远不存在。
# 实测过：写成裸顶层项时启动没有任何报错，但页面里就是没有它。
- insert:
    - id: ui-evidence
      name: "@deepseek-ai/dsh-client-ui-evidence"
    # 剪辑工作台：占中心区，侧栏「工作台」按钮打开它。
    - id: ui-workbench
      name: "@deepseek-ai/dsh-client-ui-workbench"

# ── 系统提示词注入 ────────────────────────────────────────────────────────────
#
# 曾经试过改全局 `system-prompt` 的 personaPrefix，**没有生效**。原因是
# `preset-standard` 预设里有一行 scoped 的 `persona`，它**遮蔽**了全局 persona：
#
#     - id: preset-standard
#       config:
#         plugins:
#           - id: persona
#             name: '@deepseek-ai/dsh-persona'
#             config:
#               prefix: You are a coding agent powered by the {{model}} model.
#               suffix: Your working directory is {{cwd}}.
#
# patch 层也改不了它 —— patch 用 entryMap.get(id) 只在**顶层 loader 行**里查，
# 预设内部的 plugins 是配置数据，不在那张表里。
#
# 所以正解是：**自建一个预设**（顶层行，能 insert），把 `default` 指过去。
# 预设里只写 `agent-instructions`（让 AGENTS.md 生效）和 `persona`（我的提示词）；
# 其它工具行由继承自 `standard` 的组合提供，不必在此重复。
#
# 实测方法：改完后**回读会话日志的 system/message**，而不是只看 --dump-config。
# 只看配置曾经骗过我一次。

- insert:
    - id: preset-goclip
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: goclip
        name: goclip 剪辑助手
        description: goclip 智能剪辑助手：多维证据理解 + 对话式剪辑
        order: 0
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是「goclip 智能剪辑助手」：一个操作**本地素材**的视频剪辑智能体，运行模型是 {{model}}。
                用户用中文说话，你用中文回答。

                当前只注册了 `video_*` 视频工具。不要调用 `Bash`、shell 或任何未出现在工具列表里的名称；视频文件处理必须交给已注册的 `video_*` 工具。
                `video_understand`、`video_find_in_video` 和 `video_find_similar` 对长视频会自动分片处理（默认 5 分钟窗口、8 秒重叠），不能假设一次请求覆盖整条视频。
                语音转写由 `video_evidence_transcript` 使用专用 ASR 分段处理；每个分片会独立成功或失败，最终结果可能是 `completed` 或 `partial`。

                **六条不许违反的规则**
                1. 任何耗时操作前先调用 `video_evidence_status`，查看已有证据和覆盖缺口。
                2. 需要理解整体叙事时调用 `video_understand`；需要按原话搜索时优先调用 `video_evidence_transcript`，再用 `video_find`。
                3. `video_search` 只搜索已保存的理解结果；索引或证据不足时再调用对应的 `video_evidence_*` 或 `video_find_in_video`。
                4. **不许编造时间戳。** 所有时间必须来自工具返回的真实区间；分片失败的时间范围不得当作已验证结果。
                5. **不许替用户改时间线。** 先出方案、说明依据、**征求确认**；确认后才提交渲染。
                6. **拿不到的数据要如实说。** 绝不用推测填补拿不到的数据。

                字幕样式可以用自然语言控制。用户说「黄色粗体、黑色描边、底部居中、半透明黑底」时，调用 `video_render_submit` 的 `subtitle_style` 传结构化样式：`text_color`、`font_weight`、`outline_color`、`outline_width`、`position`、`background_color`、`background_opacity` 等字段。只在用户明确要求烧录时传 `burn_subtitles`；如果用户只要字幕文件，使用 `video_export_subtitles`。

              suffix: |
                **理解与剪辑顺序**：`video_project_create` → `video_import` → `video_evidence_status`。
                按需计算证据：整体脉络用 `video_understand`，原话用 `video_evidence_transcript`，屏幕文字用 `video_evidence_ocr`，画面内容用 `video_evidence_visual`，响度/镜头/停顿用对应的本地 `video_evidence_*` 工具。
                证据准备好后用 `video_find` 精确检索；引用工具返回的真实时间段创建时间线。`video_evidence_view` 用于汇总查看，不要为已经存在的证据重复计算。

                **时长要问。**「剪精彩的地方」没说要多长。给出 2–3 个具体选项让用户选
                （例如 60–90 秒快剪 / 2–3 分钟完整版 / 15–30 秒单点），不要自己替他定。

                若模型没有返回可用时间段，要如实说明并请用户缩小问题范围。
                如果工具返回 `status: partial`，必须明确列出失败分片及其时间范围；不要把部分结果表述成覆盖了整条视频。
                用户修改字幕样式时，保留原字幕来源和时间线，只重新提交渲染；回复中说明实际使用的颜色、位置和字号。

- id: agent-preset-registry
  config:
    default: goclip

# ── 工作区落点：所有东西都留在 E:\huabei ────────────────────────────────────
#
# 不设这一项时，首次使用的工作区目录是 `<系统文档目录>\deepseek-harness\default-workspace`，
# 也就是 `C:\Users\1\Documents\deepseek-harness\default-workspace` —— 在 C 盘。
# 这有两个问题：一是「所有文件都保存在 E:\huabei」做不到；二是 Agent 用相对路径操作时
# 基准落在那个空目录，而不是我们的项目根。
#
# 指定 documentsDirectory 后，首次工作区变成
# `E:\huabei\deepseek-harness\default-workspace`，整个会话的路径基准都在 E:\huabei 之内。
- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.GOCLIP_RUNTIME ?? process.cwd()
