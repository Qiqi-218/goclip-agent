# Profile patch: 智能剪辑助手的模型接入
#
# 模型走阿里云百炼（Model Studio）的 OpenAI 兼容端点。
# 这里 **不写密钥** —— `apiKeyEnv` 是凭据引用，按请求经 harness 凭据 seam 解析；
# 密钥只留在启动进程的环境变量里，绝不提交到仓库。
#
# 已实测（2026-10-01）：该端点 HTTP 200 可用，且支持 OpenAI 工具调用
# （tools / tool_calls 返回正常），所以 DSH 的 agent 循环能在上面跑。

- id: llm-pi-ai
  config:
    providers:
      bailian:
        apiKeyEnv: AUTOCLIP_TEXT_API_KEY
        api: openai-completions
        baseURL: https://llm-gg1ri1xazge7fzx4.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        displayName: 阿里云百炼
        models:
          # 文本主力：工具调用已验证。name 是界面显示名，省得模型选择器
          # 用 pi-ai 目录里的默认名把这个 id 显示成另一个厂商的模型。
          - id: qwen-plus
            name: Qwen-Plus
          # 视觉：用于「看画面抽帧」，是 U4/U5 两条需求的关键
          - id: qwen-vl-plus
            name: Qwen-VL-Plus
            input: [text, image]
          - id: qwen-vl-max
            name: Qwen-VL-Max
            input: [text, image]
          # 长上下文兜底
          - id: qwen-max
            name: Qwen-Max
          # 主力换成 omni-flash：实测该端点上可用（HTTP 200）。
          # 前一个主力 qwen-plus 在一次「帮我剪精彩的地方」里**空转了 60 多次**，
          # 反复用 amazing / wow / 精彩 / 高潮 这些词搜字幕 —— 见下面 system-prompt
          # 一段的说明。换模型只是缓解，真正的修法是提示词 + 工具描述。
          - id: qwen3.5-omni-flash
            name: Qwen3.5-Omni-Flash
            contextWindow: 1048576

# 默认模型必须显式指向百炼。
#
# 不写这一段时界面模型选择器显示 deepseek-flash —— 那是上游默认值，而本机
# **没有** DEEPSEEK_API_KEY，于是输入框看上去可用、实际一发起就失败。
# 竞赛要求标明所用大模型名称与版本号，因此这里必须与实际调用的模型一致。
- id: agent-default-model
  config:
    provider: bailian
    model: qwen3.5-omni-flash

- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# ── 系统提示词注入 ────────────────────────────────────────────────────────────
#
# 曾经试过改全局 `system-prompt` 的 personaPrefix，**没有生效**。原因是
# `preset-standard` 预设里有一行 scoped 的 `persona`，它**遮蔽**了全局 persona：
#
#     - id: preset-standard
#       config:
#         plugins:
#           - id: persona
#             name: '@deepseek-ai/dsh-persona'
#             config:
#               prefix: You are a coding agent powered by the {{model}} model.
#               suffix: Your working directory is {{cwd}}.
#
# patch 层也改不了它 —— patch 用 entryMap.get(id) 只在**顶层 loader 行**里查，
# 预设内部的 plugins 是配置数据，不在那张表里。
#
# 所以正解是：**自建一个预设**（顶层行，能 insert），把 `default` 指过去。
# 预设里只写 `agent-instructions`（让 AGENTS.md 生效）和 `persona`（我的提示词）；
# 其它工具行由继承自 `standard` 的组合提供，不必在此重复。
#
# 实测方法：改完后**回读会话日志的 system/message**，而不是只看 --dump-config。
# 只看配置曾经骗过我一次。

- insert:
    - id: preset-goclip
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: goclip
        name: goclip 剪辑助手
        description: goclip 智能剪辑助手：四维素材理解 + 对话式剪辑
        order: 0
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是「goclip 智能剪辑助手」：一个操作**本地素材**的视频剪辑智能体，运行模型是 {{model}}。
                用户用中文说话，你用中文回答。

                视频理解由 `video_understand` 把完整视频交给 Omni 同时分析画面和声音，返回带时间戳的结构化片段。
                用户说的是剪辑视频时，优先用 `video_*` 工具，不要用 shell 解析视频。

                **五条不许违反的规则**
                1. 未理解视频时先调用 `video_understand`，不要猜测内容。
                2. `video_search` 只搜索已保存的理解结果；无结果时用 `video_find_in_video` 让 Omni 按具体问题复查。
                3. **不许编造时间戳。** 所有时间必须来自工具返回的真实区间。
                4. **不许替用户改时间线。** 先出方案、说明依据、**征求确认**；确认后才提交渲染。
                5. **拿不到的数据要如实说。** 绝不用推测填补拿不到的数据。

              suffix: |
                **理解与剪辑顺序**：`video_project_create` → `video_import` → `video_understand`。
                需要指定内容时先 `video_search`，索引不够再用 `video_find_in_video`。引用工具返回的时间段创建时间线。

                **时长要问。**「剪精彩的地方」没说要多长。给出 2–3 个具体选项让用户选
                （例如 60–90 秒快剪 / 2–3 分钟完整版 / 15–30 秒单点），不要自己替他定。

                若模型没有返回可用时间段，要如实说明并请用户缩小问题范围。

- id: agent-preset-registry
  config:
    default: goclip

# ── 工作区落点：所有东西都留在 E:\huabei ────────────────────────────────────
#
# 不设这一项时，首次使用的工作区目录是 `<系统文档目录>\deepseek-harness\default-workspace`，
# 也就是 `C:\Users\1\Documents\deepseek-harness\default-workspace` —— 在 C 盘。
# 这有两个问题：一是「所有文件都保存在 E:\huabei」做不到；二是 Agent 用相对路径操作时
# 基准落在那个空目录，而不是我们的项目根。
#
# 指定 documentsDirectory 后，首次工作区变成
# `E:\huabei\deepseek-harness\default-workspace`，整个会话的路径基准都在 E:\huabei 之内。
- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.GOCLIP_RUNTIME ?? process.cwd()
