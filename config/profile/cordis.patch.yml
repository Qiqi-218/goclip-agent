# Profile patch: 智能剪辑助手的模型接入
#
# 模型走阿里云百炼（Model Studio）的 OpenAI 兼容端点。
# 这里 **不写密钥** —— `apiKeyEnv` 是凭据引用，按请求经 harness 凭据 seam 解析；
# 密钥只留在启动进程的环境变量里，绝不提交到仓库。
#
# 已实测（2026-10-01）：该端点 HTTP 200 可用，且支持 OpenAI 工具调用
# （tools / tool_calls 返回正常），所以 DSH 的 agent 循环能在上面跑。

- id: llm-pi-ai
  config:
    providers:
      bailian:
        apiKeyEnv: AUTOCLIP_TEXT_API_KEY
        api: openai-completions
        # 端点走环境变量，不写死。
        #
        # 百炼的 baseURL 是**按 workspace 分配的**（形如
        # https://llm-<每个账号不同>.cn-beijing.maas.aliyuncs.com/compatible-mode/v1），
        # 写死意味着别人 clone 下来必须来改这一行才能跑。它也不是密钥，
        # 但把某个具体 workspace 的地址放进公开仓库没有意义。
        baseURL: !!js process.env.AUTOCLIP_TEXT_BASE_URL
        displayName: 阿里云百炼
        models:
          # 主力：已实测该端点可用（HTTP 200）。
          - id: qwen3.8-omni-flash
            name: Qwen3.8-Omni-Flash
            contextWindow: 1048576

# 默认模型必须显式指向百炼。
#
# 不写这一段时界面模型选择器显示 deepseek-flash —— 那是上游默认值，而本机
# **没有** DEEPSEEK_API_KEY，于是输入框看上去可用、实际一发起就失败。
# 竞赛要求标明所用大模型名称与版本号，因此这里必须与实际调用的模型一致。
- id: agent-default-model
  config:
    provider: bailian
    model: qwen3.8-omni-flash

- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# 证据面板：`video_evidence_view` 的调用卡片。
#
# 它必须作为**独立的一行**出现，不能只写进插件的 cordis.patch.yml ——
# 客户端 bundle 的清单是服务端启动时按 loader 行扫出来的（读每行的包名 →
# package.json 的 dsh.client → exports["./client"] → lib/client.js），
# 没有这一行就没有那次扫描，界面里只会看到通用工具行。
#
# 而且必须放在 `insert:` 里：patch 的一条**不带 insert 的顶层项**只会去
# 匹配已有的同名行，匹配不到就什么都不做（不报错），这一行也就永远不存在。
# 实测过：写成裸顶层项时启动没有任何报错，但页面里就是没有它。
- insert:
    - id: ui-evidence
      name: "@deepseek-ai/dsh-client-ui-evidence"
    # 剪辑工作台：占中心区，侧栏「工作台」按钮打开它。
    - id: ui-workbench
      name: "@deepseek-ai/dsh-client-ui-workbench"

# ── 系统提示词注入 ────────────────────────────────────────────────────────────
#
# 曾经试过改全局 `system-prompt` 的 personaPrefix，**没有生效**。原因是
# `preset-standard` 预设里有一行 scoped 的 `persona`，它**遮蔽**了全局 persona：
#
#     - id: preset-standard
#       config:
#         plugins:
#           - id: persona
#             name: '@deepseek-ai/dsh-persona'
#             config:
#               prefix: You are a coding agent powered by the {{model}} model.
#               suffix: Your working directory is {{cwd}}.
#
# patch 层也改不了它 —— patch 用 entryMap.get(id) 只在**顶层 loader 行**里查，
# 预设内部的 plugins 是配置数据，不在那张表里。
#
# 所以正解是：**自建一个预设**（顶层行，能 insert），把 `default` 指过去。
# 预设里只写 `agent-instructions`（让 AGENTS.md 生效）和 `persona`（我的提示词）；
# 其它工具行由继承自 `standard` 的组合提供，不必在此重复。
#
# 实测方法：改完后**回读会话日志的 system/message**，而不是只看 --dump-config。
# 只看配置曾经骗过我一次。

- insert:
    - id: preset-goclip
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: goclip
        name: goclip 剪辑助手
        description: goclip 智能剪辑助手：四维素材理解 + 对话式剪辑
        order: 0
        plugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是「goclip 智能剪辑助手」：一个操作**本地素材**的视频剪辑智能体，运行模型是 {{model}}。
                用户用中文说话，你用中文回答。

                视频理解由 `video_understand` 把完整视频交给 Omni 同时分析画面和声音，返回带时间戳的结构化片段。
                用户说的是剪辑视频时，优先用 `video_*` 工具，不要用 shell 解析视频。

                **六条不许违反的规则**
                1. 未理解视频时先调用 `video_understand`，不要猜测内容。
                2. **动手之前先看 `evidence_coverage`。** `video_understand` 与 `video_find` 的返回里都有它，写着每一类证据**实际覆盖到第几秒**（不只是「算没算过」）。某句话落在覆盖范围之外时，任何工具都找不到它 —— 这时要直接告诉用户「这段没有可用的字幕/语音证据」，不要继续换工具试。
                3. **时间定位一律先用 `video_find`。** 语音转写与屏幕文字都是逐字的，把要定位的那句话直接放进 `text`（多句放进 `texts`），返回的区间就是那句话的位置，毫秒级、无额外成本。索引不够时才用 `video_find_in_video` 让 Omni 复查 —— 它要重新看完整条视频，一次要几十秒。
                4. **不许编造时间戳。** 所有时间必须来自工具返回的真实区间。
                5. **不许替用户改时间线。** 先出方案、说明依据、**征求确认**；确认后才提交渲染。
                6. **拿不到的数据要如实说。** 绝不用推测填补拿不到的数据。

              suffix: |
                **理解与剪辑顺序**：`video_project_create` → `video_import` → `video_understand`。

                **每一步之前先读 `evidence_coverage`**（它与 `video_understand` 的结果一起返回）：
                ```
                transcript: { to_seconds: 1640, covers_picture: false, gap_to_picture_end_seconds: 944 }
                screen-text: { to_seconds: 2584, covers_picture: true }
                ```
                这表示画面有 2584 秒、而语音只到 1640 秒。落在那之后的话，**任何工具都拿不到
                它的台词级时间码** —— 不是「还没算」，是「这段没有语音」。这时应当直接说明，
                而不是用 `video_find_in_video` 去重看整片找一段不存在的声音。

                **哪些情况不要调用工具，直接说明：**
                - 要定位的内容落在某类证据的覆盖范围之外，且只有那一类能回答。
                - `evidence_missing` 已经列出缺的那一类，而问题只能由它回答。
                - 用户问的是画面里的动作/表情，而画面描述与屏幕文字里都没有相关线索。
                如实说「这段没有 X 证据，所以给不出 Y」，比花几十秒试一遍再回来说更好。

                **落在覆盖范围之外时，按这个顺序退让，不要跳到 `video_find_in_video`：**
                1. 换一类证据。语音没有不代表画面文字没有 —— 讲者说的内容常同时以字幕
                   出现在画面上，`screen-text` 往往覆盖全片。
                2. 用 `video_find` 并加 **`split_sentences: true`**。分段里的复述是分了句的，
                   它会把该段按句拆开、各给一个**估算**区间。要逐句时间而该处没有逐字
                   转写时，这是零成本的做法 —— 换算成原来的流程，比重看整片省几十秒。
                3. 仍然拿不到时，退回分段级区间并**说明这是段落位置、不是逐句时间**。
                `video_find_in_video` 只在**换过证据、也试过 `split_sentences`** 之后才用，
                而且用了要说明为什么要用。

                要定位某句话、某个词出现在什么时候，直接 `video_find`：把原话放进 `text`，
                一次问多句就用 `texts` 数组（每条结果里的 `matched_text` 说明命中的是哪一句）。
                转写来自专用语音识别模型、屏幕文字来自专用 OCR 模型，两者都是**逐字**的，
                所以原话能字面命中。

                只有 `video_find` 确实答不上来（例如问的是画面里某个动作、而转写与屏幕文字里都没有）时，
                才用 `video_find_in_video` —— 它的代价是让模型重看整条视频，比前者慢几个数量级。
                引用工具返回的时间段创建时间线。

                **时长要问。**「剪精彩的地方」没说要多长。给出 2–3 个具体选项让用户选
                （例如 60–90 秒快剪 / 2–3 分钟完整版 / 15–30 秒单点），不要自己替他定。

                若模型没有返回可用时间段，要如实说明并请用户缩小问题范围。

- id: agent-preset-registry
  config:
    default: goclip

# ── 工作区落点：所有东西都留在 E:\huabei ────────────────────────────────────
#
# 不设这一项时，首次使用的工作区目录是 `<系统文档目录>\deepseek-harness\default-workspace`，
# 也就是 `C:\Users\1\Documents\deepseek-harness\default-workspace` —— 在 C 盘。
# 这有两个问题：一是「所有文件都保存在 E:\huabei」做不到；二是 Agent 用相对路径操作时
# 基准落在那个空目录，而不是我们的项目根。
#
# 指定 documentsDirectory 后，首次工作区变成
# `E:\huabei\deepseek-harness\default-workspace`，整个会话的路径基准都在 E:\huabei 之内。
- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.GOCLIP_RUNTIME ?? process.cwd()
