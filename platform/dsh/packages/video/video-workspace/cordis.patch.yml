# 智能剪辑助手 bundle
#
# 一个 host 侧插件行：工具在 DSH 进程内执行本地媒体操作，不需要 video-agent HTTP 服务。

- insert:
    - id: video-workspace
      name: dsh-video-workspace
      config:
        dataDir: !!js process.env.GOCLIP_RUNTIME + '/video-tools'
        modelBaseUrl: !!js process.env.AUTOCLIP_TEXT_BASE_URL
        model: !!js process.env.AUTOCLIP_TEXT_MODEL
        apiKeyEnv: AUTOCLIP_TEXT_API_KEY
        ossEndpoint: !!js process.env.GOCLIP_OSS_ENDPOINT
        ossBucket: !!js process.env.GOCLIP_OSS_BUCKET
        ossAccessKeyIdEnv: GOCLIP_OSS_ACCESS_KEY_ID
        ossAccessKeySecretEnv: GOCLIP_OSS_ACCESS_KEY_SECRET
        ossPrefix: goclip-temporary
        ossOutputPrefix: goclip-exports
        ossProjectPrefix: goclip-projects
        signedUrlSeconds: 900
        # 导入时整个文件会被读进内存再上传 OSS，这个上限防止长视频撑爆进程堆。
        maxImportBytes: 4294967296
        requestTimeoutMs: 120000
        # OSS/ASR 的网络抖动会重试；次数包含首次，避免一次断连让整条处理归零。
        ossAttempts: 3
        ossRetryBaseMs: 1000
        modelTimeoutMs: 1800000
        searchLimit: 50
        # 导入后是否保留本地源文件。默认 false（删源文件，素材归 OSS）；
        # 想保住原始文件就改成 true。
        # ⚠️ 改为 true：默认值 false 会在导入后删除本地源文件。
        # 素材是你的测试数据，删了就只剩 OSS 一份，所以这里保留源文件。
        keepSourceFiles: true
        # 起点离关键帧超过这个毫秒数就重新编码（保证帧精确），否则直接复制（快）。
        keyframeToleranceMs: 500
        # 一次回复的输出上限（含推理 token）。模型硬顶 131072；
        # 不设的话服务端会用一个隐藏上限，撞上时 JSON 被截半，报错却像"模型没按要求回答"。
        maxOutputTokens: 32768
        # 思考强度：low / medium / high。留空用部署默认值。
        # 推理按输出计费，短查询不需要长思考链，可以调低省钱。
        reasoningEffort: medium
        # 语音识别走专用模型，不是多模态模型。
        #
        # 同一个模型既看画面又转写语音时，43 分钟素材花了 192 秒、思考通道撞满
        # 16384 token、结构化输出为空，还被存成「这段视频没有人声」—— 随后引出
        # 21 次整片重看（838 秒）。分窗也没救回来：三种窗口尺寸都拿不到完整覆盖。
        # 换成识别模型后同一条素材 41 秒跑完，专有名词全对。
        #
        # 必须带 `-filetrans` 后缀：同步变体只接受 5 分钟音频，而且经兼容端点
        # 调用时**不返回任何时间戳**，而时间戳是整条检索链的前提。
        asrModel: qwen-audio-3.1-asr-flash-filetrans
        # 任务式端点与兼容端点不同根：提交在 /services/audio/asr/transcription，
        # 轮询在 /tasks/{id}，两者都在 /api/v1 下。
        asrBaseUrl: https://dashscope.aliyuncs.com/api/v1
        # 轮询间隔：任务端点允许 20 QPS，更密没有意义，而每次轮询都占配额。
        asrPollMs: 4000
        # 超时后按失败上报，而不是把调用方挂在那里等。
        asrTimeoutMs: 600000
        # 与 llm-pi-ai 用的是同一个百炼 Key，所以指向同一个环境变量。
        asrApiKeyEnv: AUTOCLIP_TEXT_API_KEY
        # 单个模型请求的尝试次数（含首次）。覆盖限流与 5xx；非 429 的 4xx 不重试。
        modelAttempts: 3
        # 长视频由模型分片处理；短于 10 分钟仍保持一次调用。
        modelChunkThresholdSeconds: 600
        modelChunkSeconds: 300
        modelChunkOverlapSeconds: 8
